name = "visitor-route-demo"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

# Bundle the demo page into the worker. No separate asset host.
rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = false }
]

[vars]
ADAPTERS = "mock"
ICP_THRESHOLD = "70"
DEMO_PACE_MS = "220"

# Optional persistence across worker isolates. Leave commented for the in-memory demo.
# Create a namespace with: npx wrangler kv namespace create LEADS_KV
# [[kv_namespaces]]
# binding = "LEADS_KV"
# id = "replace-with-your-namespace-id"
